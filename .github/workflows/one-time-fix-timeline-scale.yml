name: One-time timeline scale fix

on:
  push:
    branches:
      - feat/issue-13-live-projections

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/issue-13-live-projections
          fetch-depth: 0

      - name: Apply proportional month scale fix
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          app = Path('src/App.tsx')
          text = app.read_text()

          old = '''function timelinePosition(referenceDate: string, date: string): string {
            const offset = Math.max(0, Math.min(89, differenceInCalendarDays(date, referenceDate)));
            return `${(offset / 89) * 100}%`;
          }

          function monthSequence(start: string, end: string): Array<{ id: string; label: string }> {
            const startDate = parseIsoDate(start);
            const endDate = parseIsoDate(end);
            const months: Array<{ id: string; label: string }> = [];
            let year = startDate.getUTCFullYear();
            let month = startDate.getUTCMonth();
            const endIndex = endDate.getUTCFullYear() * 12 + endDate.getUTCMonth();

            while (year * 12 + month <= endIndex) {
              months.push({ id: `${year}-${month + 1}`, label: `${month + 1}月` });
              month += 1;
              if (month === 12) {
                month = 0;
                year += 1;
              }
            }
            return months;
          }
          '''
          new = '''function timelinePosition(referenceDate: string, date: string): string {
            const offset = Math.max(0, Math.min(89, differenceInCalendarDays(date, referenceDate)));
            return `${((offset + 0.5) / 90) * 100}%`;
          }

          interface TimelineMonth {
            id: string;
            label: string;
            days: number;
          }

          function monthSequence(start: string, end: string): TimelineMonth[] {
            const startDate = parseIsoDate(start);
            const endDate = parseIsoDate(end);
            const endExclusive = new Date(endDate.getTime() + 24 * 60 * 60 * 1000);
            const months: TimelineMonth[] = [];
            let cursor = new Date(Date.UTC(startDate.getUTCFullYear(), startDate.getUTCMonth(), 1));

            while (cursor <= endDate) {
              const year = cursor.getUTCFullYear();
              const month = cursor.getUTCMonth();
              const nextMonth = new Date(Date.UTC(year, month + 1, 1));
              const segmentStart = cursor < startDate ? startDate : cursor;
              const segmentEnd = nextMonth < endExclusive ? nextMonth : endExclusive;
              const days = Math.max(
                1,
                Math.round((segmentEnd.getTime() - segmentStart.getTime()) / (24 * 60 * 60 * 1000)),
              );

              months.push({ id: `${year}-${month + 1}`, label: `${month + 1}月`, days });
              cursor = nextMonth;
            }

            return months;
          }
          '''
          if old not in text:
              raise SystemExit('timeline helper block not found')
          text = text.replace(old, new, 1)

          old = '''            <div
              className="month-scale live-month-scale"
              style={{ '--month-count': months.length } as CSSProperties}
            >
              {months.map((month) => <span key={month.id}>{month.label}</span>)}
            </div>'''
          new = '''            <div
              className="month-scale live-month-scale"
              style={{
                gridTemplateColumns: months.map((month) => `minmax(0, ${month.days}fr)`).join(' '),
              }}
            >
              {months.map((month) => <span key={month.id}>{month.label}</span>)}
            </div>'''
          if old not in text:
              raise SystemExit('month scale render block not found')
          text = text.replace(old, new, 1)
          app.write_text(text)

          live = Path('src/live.css')
          css = live.read_text()
          css = css.replace('''.live-month-scale {
            grid-template-columns: repeat(var(--month-count), minmax(0, 1fr));
          }

          ''', '', 1)
          live.write_text(css)

          test = Path('tests/mock-ui.spec.mjs')
          test_text = test.read_text()
          marker = '''test('keyboard focus is visible on the skip link', async ({ page }) => {'''
          insertion = '''test('90-day month scale uses calendar-day proportions and keeps deadline pins in the correct month', async ({ page }) => {
            await freezeDate(page);
            await page.addInitScript((data) => {
              window.localStorage.setItem('ms-credentials-tracker:credentials:v1', JSON.stringify(data));
            }, storedEnvelope());
            await page.setViewportSize({ width: 1440, height: 1000 });
            await page.goto('/');

            const monthLabels = page.locator('.month-scale span');
            const september = await monthLabels.filter({ hasText: '9月' }).boundingBox();
            const october = await monthLabels.filter({ hasText: '10月' }).boundingBox();
            const november = await monthLabels.filter({ hasText: '11月' }).boundingBox();
            const december = await monthLabels.filter({ hasText: '12月' }).boundingBox();
            const deadlinePin = await page.locator('.timeline-pin-deadline').first().boundingBox();

            expect(september).not.toBeNull();
            expect(october).not.toBeNull();
            expect(november).not.toBeNull();
            expect(december).not.toBeNull();
            expect(deadlinePin).not.toBeNull();

            expect(october.width).toBeGreaterThan(september.width);
            expect(november.width).toBeGreaterThan(december.width);

            const pinCenter = deadlinePin.x + deadlinePin.width / 2;
            expect(pinCenter).toBeGreaterThanOrEqual(november.x);
            expect(pinCenter).toBeLessThanOrEqual(november.x + november.width);
          });

          '''
          if marker not in test_text:
              raise SystemExit('test insertion marker not found')
          test_text = test_text.replace(marker, insertion + marker, 1)
          test.write_text(test_text)

          Path('.github/workflows/one-time-fix-timeline-scale.yml').unlink()
          PY

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/live.css tests/mock-ui.spec.mjs .github/workflows/one-time-fix-timeline-scale.yml
          git commit -m "fix: align timeline months with calendar days"
          git push origin HEAD:feat/issue-13-live-projections
