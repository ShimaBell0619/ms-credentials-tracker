name: Apply v0.8.1 Provenance

on:
  push:
    branches: [fix/issue-58-foundation-v0.8.1]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout adoption branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/issue-58-foundation-v0.8.1
          fetch-depth: 1

      - name: Apply bounded provenance changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          agents = Path('AGENTS.md')
          text = agents.read_text()
          old = text
          text = text.replace('Foundation-Version: 0.7.2', 'Foundation-Version: 0.8.1', 1)
          text = text.replace('Foundation-Commit: 976421d0a88e059e60cfb71b86542d27640ae151', 'Foundation-Commit: 9061ea222e5e6bba1197b03088c6cb2c13f7e0c4', 1)
          text = text.replace('follow the adopted Foundation v0.7.2 profile', 'follow the adopted Foundation v0.8.1 profile', 1)
          if text == old:
              raise SystemExit('AGENTS provenance was not updated')
          agents.write_text(text)

          doc = Path('docs/FOUNDATION.md')
          text = doc.read_text()
          text = text.replace('- Adopted Foundation version: 0.7.2', '- Adopted Foundation version: 0.8.1', 1)
          text = text.replace('- Foundation commit: `976421d0a88e059e60cfb71b86542d27640ae151`', '- Foundation commit: `9061ea222e5e6bba1197b03088c6cb2c13f7e0c4`', 1)
          old_intro = 'The reusable Web CI pin intentionally remains on the reviewed v0.7.0 commit because Foundation v0.7.2 does not change the reusable Web CI contract. v0.7.2 hardens the copied Fixed Staging publisher and release-preparation discipline, so those changes are adopted deliberately without moving an unrelated workflow SHA solely for version conformity.'
          new_intro = 'The reusable Web CI pin intentionally remains on the reviewed v0.7.0 commit because Foundation v0.8.1 does not change the reusable Web CI contract. This adoption carries forward the v0.8.0 Vercel-first hosting contract and deliberately adopts the v0.8.1 Fixed Staging publisher correction and Application Release hardening without moving an unrelated workflow SHA solely for version conformity.'
          if old_intro not in text:
              raise SystemExit('expected Foundation intro not found')
          text = text.replace(old_intro, new_intro, 1)
          marker = '## Adopted AI implementation profile\n'
          impact = '''## v0.8.1 adoption impact

- GitHub Pages remains retired; Vercel Git Integration remains the deployment provider for Production, Preview, and the fixed `staging` slot.
- The Fixed Staging publisher no longer compares dynamic `workflow_run.name` / `run-name` text with the static request workflow identity; the `workflow_run.workflows` selector remains the workflow-identity boundary and the existing event, success, `main`, and same-repository checks remain intact.
- The Application Release workflow now resolves the actual tag object to the validated commit SHA, validates published/prerelease state, handles concurrent publication idempotently, and verifies final release state after publication.
- Production remains `https://credentials.shimabell.dev`; Fixed Staging remains `https://staging.credentials.shimabell.dev`; ordinary Pull Requests continue to use Vercel Preview URLs.
- No application runtime, product behavior, Web CI pin, Fixed Staging request/cleanup semantics, or deployment provider changes are part of this adoption.

'''
          if marker not in text:
              raise SystemExit('Foundation insertion marker not found')
          text = text.replace(marker, impact + marker, 1)
          text = text.replace('Normal Chat-based material changes use the v0.7.2 context-routed implementation profile.', 'Normal Chat-based material changes use the v0.8.1 context-routed implementation profile.', 1)
          text = text.replace('PR #50 is consumer evidence for a candidate UI standard beyond Foundation v0.7.2.', 'PR #50 is consumer evidence for a candidate UI standard beyond Foundation v0.8.1.', 1)
          text = text.replace('not claimed as released v0.7.2 Foundation UI requirements', 'not claimed as released v0.8.1 Foundation UI requirements', 1)
          doc.write_text(text)
          PY

      - name: Commit provenance only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md docs/FOUNDATION.md
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = 'AGENTS.md docs/FOUNDATION.md '
          git commit -m 'docs: adopt Foundation v0.8.1 provenance'
          git push origin HEAD:fix/issue-58-foundation-v0.8.1
