name: README GIF Preview

on:
  pull_request:
    paths:
      - README.md
      - scripts/capture-readme-gif.mjs
      - src/**
      - package.json
      - package-lock.json
      - .github/workflows/readme-gif-preview.yml

permissions:
  contents: write

jobs:
  generate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'docs/update-readme-overview'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request commit
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Generate README GIF
        run: npm run docs:gif

      - name: Commit generated GIF
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/assets/readme-overview.gif
          if git diff --cached --quiet; then
            echo 'README GIF is already current.'
            exit 0
          fi
          git commit -m 'docs: refresh README overview GIF'
          git push origin "HEAD:${HEAD_BRANCH}"
