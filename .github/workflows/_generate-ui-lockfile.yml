name: Apply UI refresh implementation

on:
  push:
    branches:
      - feat/ui-foundation-46
    paths:
      - .github/workflows/_generate-ui-lockfile.yml

permissions:
  contents: write

env:
  CI: 'true'

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/ui-foundation-46
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: npm
      - name: Resolve pinned UI dependencies
        run: |
          npm install --save-exact @radix-ui/react-dialog @radix-ui/react-slot class-variance-authority clsx lucide-react tailwind-merge
          npm install --save-dev --save-exact tailwindcss @tailwindcss/vite
      - name: Apply reviewed UI source bundle
        shell: bash
        run: |
          cat .tmp/ui-source/part* | base64 --decode > /tmp/ui-source.tar.gz
          tar -xzf /tmp/ui-source.tar.gz -C .
          rm -f src/import.css src/calendar-sync.css src/live.css src/maintenance.css src/components/ManualCredentialDialog.tsx
          rm -rf .tmp/ui-source
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: rebuild UI on Tailwind and shadcn primitives'
          git push origin HEAD:feat/ui-foundation-46
