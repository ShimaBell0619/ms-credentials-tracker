name: Generate UI lockfile

on:
  push:
    branches:
      - feat/ui-foundation-46
    paths:
      - .github/workflows/_generate-ui-lockfile.yml

permissions:
  contents: read

env:
  CI: 'true'

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: npm
      - name: Resolve UI dependencies
        run: |
          npm install --save-exact @radix-ui/react-dialog @radix-ui/react-slot class-variance-authority clsx lucide-react tailwind-merge
          npm install --save-dev --save-exact tailwindcss @tailwindcss/vite
      - name: Upload generated manifests
        uses: actions/upload-artifact@v4
        with:
          name: ui-manifests
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
