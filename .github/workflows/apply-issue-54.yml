name: Apply Issue 54

on:
  push:
    branches:
      - fix/issue-54-staging-publisher

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: fix/issue-54-staging-publisher
          fetch-depth: 0
      - name: Apply bounded changes
        shell: python
        run: |
          from pathlib import Path

          agents = Path('AGENTS.md')
          text = agents.read_text()
          replacements = {
              'Foundation-Version: 0.7.1': 'Foundation-Version: 0.7.2',
              'Foundation-Commit: 4e8d704865b429cfa8d94631d34f93cb3b4ad44c': 'Foundation-Commit: 976421d0a88e059e60cfb71b86542d27640ae151',
              'follow the adopted Foundation v0.7.1 profile': 'follow the adopted Foundation v0.7.2 profile',
          }
          for old, new in replacements.items():
              assert text.count(old) == 1, old
              text = text.replace(old, new)
          agents.write_text(text)

          foundation = Path('docs/FOUNDATION.md')
          text = foundation.read_text()
          assert text.count('- Adopted Foundation version: 0.7.1') == 1
          text = text.replace('- Adopted Foundation version: 0.7.1', '- Adopted Foundation version: 0.7.2')
          assert text.count('- Foundation commit: `4e8d704865b429cfa8d94631d34f93cb3b4ad44c`') == 1
          text = text.replace('- Foundation commit: `4e8d704865b429cfa8d94631d34f93cb3b4ad44c`', '- Foundation commit: `976421d0a88e059e60cfb71b86542d27640ae151`')
          old = 'The reusable Web CI pin intentionally remains on the reviewed v0.7.0 commit because Foundation v0.7.1 refines Chat implementation guidance only and does not change the reusable workflow contract. Do not move a workflow SHA solely for version conformity.'
          new = 'The reusable Web CI pin intentionally remains on the reviewed v0.7.0 commit because Foundation v0.7.2 does not change the reusable Web CI contract. v0.7.2 hardens the copied Fixed Staging publisher and release-preparation discipline, so those changes are adopted deliberately without moving an unrelated workflow SHA solely for version conformity.'
          assert text.count(old) == 1
          text = text.replace(old, new)
          assert text.count('v0.7.1 context-routed implementation profile') == 1
          text = text.replace('v0.7.1 context-routed implementation profile', 'v0.7.2 context-routed implementation profile')
          text = text.replace('beyond Foundation v0.7.1', 'beyond Foundation v0.7.2')
          text = text.replace('released v0.7.1 Foundation UI requirements', 'released v0.7.2 Foundation UI requirements')
          marker = '- Vercel Git Integration remains the deployment owner after GitHub moves the `staging` ref.\n'
          addition = '- The publisher keeps runner-scoped request-file paths at step scope so `${{ runner.temp }}` is evaluated only after a runner exists, matching the Foundation v0.7.2 correction.\n'
          assert text.count(marker) == 1
          text = text.replace(marker, marker + addition)
          foundation.write_text(text)

          workflow = Path('.github/workflows/deploy-staging.yml')
          text = workflow.read_text()
          bad = '      STAGING_REQUEST_FILE: ${{ runner.temp }}/fixed-staging-request/request.json\n'
          assert text.count(bad) == 1
          text = text.replace(bad, '')
          old_step = '      - name: Move fixed Staging slot to PR HEAD\n        run: node scripts/staging-slot.mjs deploy\n'
          new_step = '      - name: Move fixed Staging slot to PR HEAD\n        env:\n          STAGING_REQUEST_FILE: ${{ runner.temp }}/fixed-staging-request/request.json\n        run: node scripts/staging-slot.mjs deploy\n'
          assert text.count(old_step) == 1
          text = text.replace(old_step, new_step)
          workflow.write_text(text)
      - name: Commit bounded changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md docs/FOUNDATION.md .github/workflows/deploy-staging.yml
          git commit -m "fix: adopt Foundation v0.7.2 staging correction"
          git push origin HEAD:fix/issue-54-staging-publisher
