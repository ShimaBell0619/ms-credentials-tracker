name: One-time release v0.1.0

on:
  push:
    branches:
      - feat/issue-13-live-projections

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release for existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'GitHub Release v0.1.0 already exists; nothing to do.'
            exit 0
          fi

          gh release create v0.1.0 \
            --repo "$GITHUB_REPOSITORY" \
            --title 'v0.1.0 - Initial beta' \
            --prerelease \
            --notes $'Initial beta release.\n\n- Import Microsoft Learn Transcript PDFs locally in the browser\n- Confirm and persist credential facts in browser-local storage\n- Project renewal status, deadlines, 90-day schedule, calendar, and upcoming events from confirmed data\n- Use proportional calendar-day scaling on the 90-day timeline\n\nNo Microsoft account authentication, server database, or automatic synchronization yet.'
