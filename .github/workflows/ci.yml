    uses: ShimaBell0619/web-app-foundation/.github/workflows/web-ci.yml@a8c9098653446127e2610f4abaf44dd55ffe50a6
    with:
      node_version_file: .node-version
      cache_dependency_path: package-lock.json
      run_test: true
      run_e2e: true
