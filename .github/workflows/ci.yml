    uses: ShimaBell0619/web-app-foundation/.github/workflows/web-ci.yml@7b2ac5cb75b0055489a0f9e2c8864672145bb30e
    with:
      node_version_file: .node-version
      cache_dependency_path: package-lock.json
      run_test: true
      run_e2e: true
