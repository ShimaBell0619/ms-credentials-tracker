name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    uses: ShimaBell0619/web-app-foundation/.github/workflows/web-ci.yml@c968b8af1f666d8f6024cd9e292c91cbf631fefe
    with:
      node_version_file: .node-version
      cache_dependency_path: package-lock.json
      run_test: true
      run_e2e: true
