name: One-time Azure transcript cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-mscred-azure.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: one-time-mscred-azure-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete retired Transcript Azure resources
    runs-on: ubuntu-latest
    steps:
      - name: Sign in to Azure with OIDC
        uses: Azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Delete retired resource group
        shell: bash
        run: |
          set -euo pipefail
          resource_group='rg-mscred-prod-jpe-01'

          exists="$(az group exists --name "$resource_group" --output tsv)"
          echo "Before cleanup: $resource_group exists=$exists"

          if [[ "$exists" != 'true' ]]; then
            echo "Resource group is already absent: $resource_group"
            exit 0
          fi

          echo "Deleting retired resource group: $resource_group"
          az group delete --name "$resource_group" --yes

          if [[ "$(az group exists --name "$resource_group" --output tsv)" == 'true' ]]; then
            echo "::error::Resource group still exists after delete returned: $resource_group"
            exit 1
          fi

          echo "Confirmed deleted: $resource_group"
