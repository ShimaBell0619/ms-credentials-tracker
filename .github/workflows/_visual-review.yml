name: Temporary Astra follow-up visual review

on:
  push:
    branches:
      - feat/ui-foundation-46
    paths:
      - .github/workflows/_visual-review.yml

permissions:
  contents: read

env:
  CI: 'true'

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build and start preview
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/ui-review.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ui-review.log
          exit 1

      - name: Capture rendered states
        shell: bash
        run: |
          mkdir -p visual-review
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';

          const stored = {
            version: 2,
            credentials: [
              { id: 'visual:az104', credentialDefinitionId: 'cert.azure-administrator-associate', source: 'learnTranscriptPdf', sourceRecordId: null, sourceTitle: 'AZ-104', firstEarnedOn: '2023-11-19', currentExpiresOn: '2026-11-20', confirmedAt: '2026-09-08T00:00:00.000Z', lastTranscriptConfirmedOn: '2026-09-08', manualOverrideAt: null, archivedAt: null },
              { id: 'visual:az305', credentialDefinitionId: 'cert.azure-solutions-architect-expert', source: 'learnTranscriptPdf', sourceRecordId: null, sourceTitle: 'AZ-305', firstEarnedOn: '2024-06-28', currentExpiresOn: '2027-03-15', confirmedAt: '2026-09-08T00:00:00.000Z', lastTranscriptConfirmedOn: '2026-09-08', manualOverrideAt: null, archivedAt: null },
              { id: 'visual:az500', credentialDefinitionId: 'cert.azure-security-engineer-associate', source: 'learnTranscriptPdf', sourceRecordId: null, sourceTitle: 'AZ-500', firstEarnedOn: '2025-01-01', currentExpiresOn: '2026-08-01', confirmedAt: '2026-09-08T00:00:00.000Z', lastTranscriptConfirmedOn: '2026-09-08', manualOverrideAt: null, archivedAt: null },
              { id: 'visual:az900', credentialDefinitionId: 'cert.azure-fundamentals', source: 'learnTranscriptPdf', sourceRecordId: null, sourceTitle: 'AZ-900', firstEarnedOn: '2023-07-16', currentExpiresOn: null, confirmedAt: '2026-09-08T00:00:00.000Z', lastTranscriptConfirmedOn: '2026-09-08', manualOverrideAt: null, archivedAt: null },
            ],
            history: [],
          };

          const browser = await chromium.launch();
          const shots = [
            ['desktop-1440', 1440, 1000, stored, null],
            ['mobile-390', 390, 844, stored, null],
            ['narrow-320', 320, 800, stored, null],
            ['onboarding-390', 390, 844, null, null],
            ['data-hub-390', 390, 844, stored, 'データと連携'],
          ];

          for (const [name, width, height, data, openButton] of shots) {
            const context = await browser.newContext({ viewport: { width, height } });
            if (data) {
              await context.addInitScript((value) => {
                localStorage.setItem('ms-credentials-tracker:credentials:v2', JSON.stringify(value));
              }, data);
            }
            const page = await context.newPage();
            await page.clock.setFixedTime(new Date('2026-09-08T12:00:00Z'));
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
            if (openButton) {
              await page.getByRole('button', { name: openButton }).click();
              await page.waitForTimeout(200);
            }
            await page.screenshot({ path: `visual-review/${name}.png`, fullPage: true });
            await context.close();
          }
          await browser.close();
          NODE

      - name: Upload screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: astra-follow-up-visual-review
          path: visual-review/*.png
          if-no-files-found: error
          retention-days: 1
