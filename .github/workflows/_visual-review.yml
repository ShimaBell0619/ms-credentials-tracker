name: Temporary UI before-after review

on:
  push:
    branches:
      - feat/ui-foundation-46
    paths:
      - .github/workflows/_visual-review.yml

permissions:
  contents: read

env:
  CI: 'true'

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout main baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          path: before-source
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix before-source

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build and start previews
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          npm run build --prefix before-source
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/ui-after.log 2>&1 &
          npm run preview --prefix before-source -- --host 127.0.0.1 --port 4174 > /tmp/ui-before.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null && curl --fail --silent http://127.0.0.1:4174/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ui-after.log
          cat /tmp/ui-before.log
          exit 1

      - name: Capture comparison
        shell: bash
        run: |
          mkdir -p visual-review
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';

          const stored = {
            version: 2,
            credentials: [
              { id: 'visual:az104', credentialDefinitionId: 'cert.azure-administrator-associate', source: 'learnTranscriptPdf', sourceRecordId: null, sourceTitle: 'AZ-104', firstEarnedOn: '2023-11-19', currentExpiresOn: '2026-11-20', confirmedAt: '2026-09-08T00:00:00.000Z', lastTranscriptConfirmedOn: '2026-09-08', manualOverrideAt: null, archivedAt: null },
              { id: 'visual:az305', credentialDefinitionId: 'cert.azure-solutions-architect-expert', source: 'learnTranscriptPdf', sourceRecordId: null, sourceTitle: 'AZ-305', firstEarnedOn: '2024-06-28', currentExpiresOn: '2027-06-29', confirmedAt: '2026-09-08T00:00:00.000Z', lastTranscriptConfirmedOn: '2026-09-08', manualOverrideAt: null, archivedAt: null },
              { id: 'visual:az500', credentialDefinitionId: 'cert.azure-security-engineer-associate', source: 'learnTranscriptPdf', sourceRecordId: null, sourceTitle: 'AZ-500', firstEarnedOn: '2025-01-01', currentExpiresOn: '2026-08-01', confirmedAt: '2026-09-08T00:00:00.000Z', lastTranscriptConfirmedOn: '2026-09-08', manualOverrideAt: null, archivedAt: null },
              { id: 'visual:az900', credentialDefinitionId: 'cert.azure-fundamentals', source: 'learnTranscriptPdf', sourceRecordId: null, sourceTitle: 'AZ-900', firstEarnedOn: '2023-07-16', currentExpiresOn: null, confirmedAt: '2026-09-08T00:00:00.000Z', lastTranscriptConfirmedOn: '2026-09-08', manualOverrideAt: null, archivedAt: null },
            ],
            history: [],
          };

          const browser = await chromium.launch();
          const shots = [
            ['before-desktop-1440', 'http://127.0.0.1:4174/', 1440, 1000],
            ['after-desktop-1440', 'http://127.0.0.1:4173/', 1440, 1000],
            ['after-mobile-390', 'http://127.0.0.1:4173/', 390, 844],
            ['after-narrow-320', 'http://127.0.0.1:4173/', 320, 800],
          ];

          for (const [name, url, width, height] of shots) {
            const context = await browser.newContext({ viewport: { width, height } });
            await context.addInitScript((data) => {
              localStorage.setItem('ms-credentials-tracker:credentials:v2', JSON.stringify(data));
            }, stored);
            const page = await context.newPage();
            await page.clock.setFixedTime(new Date('2026-09-08T12:00:00Z'));
            await page.goto(url, { waitUntil: 'networkidle' });
            await page.screenshot({ path: `visual-review/${name}.png`, fullPage: true });
            await context.close();
          }
          await browser.close();
          NODE

      - name: Upload screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-before-after-review
          path: visual-review/*.png
          if-no-files-found: error
          retention-days: 1
