name: Pages publish

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pages: write

concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Set up Node.js
        if: github.event_name != 'pull_request' || github.event.action != 'closed'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build static site
        if: github.event_name != 'pull_request' || github.event.action != 'closed'
        run: |
          npm ci
          npm run build

      - name: Prepare gh-pages worktree
        shell: bash
        run: |
          set -euo pipefail
          pages_dir="$RUNNER_TEMP/pages-site"
          rm -rf "$pages_dir"

          if git fetch origin "refs/heads/gh-pages:refs/remotes/origin/gh-pages"; then
            git worktree add --detach "$pages_dir" refs/remotes/origin/gh-pages
          else
            git worktree add --detach "$pages_dir" HEAD
            git -C "$pages_dir" switch --orphan gh-pages
            find "$pages_dir" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi

          echo "PAGES_DIR=$pages_dir" >> "$GITHUB_ENV"

      - name: Update published files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == 'pull_request' ]]; then
            target="$PAGES_DIR/pr-$PR_NUMBER"
            rm -rf "$target"
            if [[ "$EVENT_ACTION" != 'closed' ]]; then
              mkdir -p "$target"
              cp -a dist/. "$target/"
            fi
          else
            find "$PAGES_DIR" -mindepth 1 -maxdepth 1 \
              ! -name .git \
              ! -name 'pr-*' \
              -exec rm -rf {} +
            cp -a dist/. "$PAGES_DIR/"
            touch "$PAGES_DIR/.production"
          fi

          touch "$PAGES_DIR/.nojekyll"

          if [[ ! -f "$PAGES_DIR/.production" ]]; then
            {
              printf '%s\n' '<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MS Credentials Tracker previews</title><body><main><h1>MS Credentials Tracker previews</h1><ul>'
              for preview in "$PAGES_DIR"/pr-*; do
                [[ -d "$preview" ]] || continue
                name="$(basename "$preview")"
                printf '<li><a href="./%s/">%s</a></li>\n' "$name" "$name"
              done
              printf '%s\n' '</ul></main></body></html>'
            } > "$PAGES_DIR/index.html"
          fi

      - name: Commit published files
        id: publish
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git -C "$PAGES_DIR" config user.name 'github-actions[bot]'
          git -C "$PAGES_DIR" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$PAGES_DIR" add -A

          if git -C "$PAGES_DIR" diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == 'pull_request' ]]; then
            if [[ "$EVENT_ACTION" == 'closed' ]]; then
              message="pages: remove PR #$PR_NUMBER preview"
            else
              message="pages: publish PR #$PR_NUMBER preview"
            fi
          else
            message='pages: publish main'
          fi

          git -C "$PAGES_DIR" commit -m "$message"
          git -C "$PAGES_DIR" push origin HEAD:gh-pages
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Verify Pages publishing source
        id: pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/pages-site.json"
          status="$(curl -sS -o "$response" -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")"

          if [[ "$status" == '404' ]]; then
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '::warning::GitHub Pages is not configured. Set Settings > Pages > Deploy from a branch > gh-pages > /(root).'
            exit 0
          fi

          if [[ "$status" != '200' ]]; then
            cat "$response"
            echo "Unexpected Pages configuration response: HTTP $status" >&2
            exit 1
          fi

          source_branch="$(jq -r '.source.branch // ""' "$response")"
          source_path="$(jq -r '.source.path // ""' "$response")"
          html_url="$(jq -r '.html_url // ""' "$response")"
          echo "Pages URL: $html_url"
          echo "Pages source: $source_branch $source_path"

          if [[ "$source_branch" == 'gh-pages' && "$source_path" == '/' ]]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo "::warning::Pages source is '${source_branch}${source_path}', not 'gh-pages /'. Change Settings > Pages to Deploy from a branch > gh-pages > /(root)."
          fi

      - name: Request GitHub Pages build
        if: steps.pages.outputs.configured == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/pages-build-response.json"
          status="$(curl -sS -o "$response" -w '%{http_code}' \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/builds")"

          if [[ "$status" != '201' ]]; then
            cat "$response"
            echo "Unexpected Pages build response: HTTP $status" >&2
            exit 1
          fi

          cat "$response"
