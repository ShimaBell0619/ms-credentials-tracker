name: Pages publish

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write

concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Set up Node.js
        if: github.event_name != 'pull_request' || github.event.action != 'closed'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build static site
        if: github.event_name != 'pull_request' || github.event.action != 'closed'
        run: |
          npm ci
          npm run build

      - name: Prepare gh-pages worktree
        shell: bash
        run: |
          set -euo pipefail
          pages_dir="$RUNNER_TEMP/pages-site"
          rm -rf "$pages_dir"

          if git fetch origin "refs/heads/gh-pages:refs/remotes/origin/gh-pages"; then
            git worktree add --detach "$pages_dir" refs/remotes/origin/gh-pages
          else
            git worktree add --detach "$pages_dir" HEAD
            git -C "$pages_dir" switch --orphan gh-pages
            find "$pages_dir" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi

          echo "PAGES_DIR=$pages_dir" >> "$GITHUB_ENV"

      - name: Update published files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            target="$PAGES_DIR/pr-$PR_NUMBER"
            rm -rf "$target"

            if [[ "$EVENT_ACTION" != "closed" ]]; then
              mkdir -p "$target"
              cp -a dist/. "$target/"
            fi
          else
            find "$PAGES_DIR" -mindepth 1 -maxdepth 1 \
              ! -name .git \
              ! -name 'pr-*' \
              -exec rm -rf {} +
            cp -a dist/. "$PAGES_DIR/"
            touch "$PAGES_DIR/.production"
          fi

          touch "$PAGES_DIR/.nojekyll"

          if [[ ! -f "$PAGES_DIR/.production" ]]; then
            {
              printf '%s\n' '<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MS Credentials Tracker previews</title><body><main><h1>MS Credentials Tracker previews</h1><ul>'
              for preview in "$PAGES_DIR"/pr-*; do
                [[ -d "$preview" ]] || continue
                name="$(basename "$preview")"
                printf '<li><a href="./%s/">%s</a></li>\n' "$name" "$name"
              done
              printf '%s\n' '</ul></main></body></html>'
            } > "$PAGES_DIR/index.html"
          fi

      - name: Commit published files
        id: publish
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git -C "$PAGES_DIR" config user.name 'github-actions[bot]'
          git -C "$PAGES_DIR" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$PAGES_DIR" add -A

          if git -C "$PAGES_DIR" diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ "$EVENT_ACTION" == "closed" ]]; then
              message="pages: remove PR #$PR_NUMBER preview"
            else
              message="pages: publish PR #$PR_NUMBER preview"
            fi
          else
            message='pages: publish main'
          fi

          git -C "$PAGES_DIR" commit -m "$message"
          git -C "$PAGES_DIR" push origin HEAD:gh-pages
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Request GitHub Pages build
        if: steps.publish.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/pages-build-response.json"
          status="$(curl -sS -o "$response" -w '%{http_code}' \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/builds")"

          if [[ "$status" == '201' ]]; then
            cat "$response"
            exit 0
          fi

          if [[ "$status" == '404' ]]; then
            echo '::warning::gh-pages is staged, but GitHub Pages is not configured yet. Set Settings > Pages > Deploy from a branch > gh-pages > /(root).'
            exit 0
          fi

          cat "$response"
          echo "Unexpected Pages build response: HTTP $status" >&2
          exit 1

      - name: Update PR preview comment
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          preview_url="https://${owner}.github.io/${repo}/pr-${PR_NUMBER}/"
          marker='<!-- pages-preview -->'

          if [[ "$EVENT_ACTION" == 'closed' ]]; then
            body="$marker\n### GitHub Pages preview\nPR #${PR_NUMBER} preview removed."
          else
            body="$marker\n### GitHub Pages preview\n[Open PR #${PR_NUMBER} preview](${preview_url})\n\nSource: \`${GITHUB_SHA}\`"
          fi

          comments="$(curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100")"

          comment_id="$(printf '%s' "$comments" | jq -r --arg marker "$marker" '.[] | select(.user.login == "github-actions[bot]" and (.body | contains($marker))) | .id' | head -n 1)"
          payload="$(jq -n --arg body "$(printf '%b' "$body")" '{body: $body}')"

          if [[ -n "$comment_id" && "$comment_id" != 'null' ]]; then
            curl -fsSL -X PATCH \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" \
              -d "$payload" >/dev/null
          else
            curl -fsSL -X POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              -d "$payload" >/dev/null
          fi
