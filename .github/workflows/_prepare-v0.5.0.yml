name: Prepare v0.5.0

on:
  push:
    branches:
      - release/v0.5.0
    paths:
      - .github/workflows/_prepare-v0.5.0.yml

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: release/v0.5.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: npm

      - name: Bump application version and clean up
        shell: bash
        run: |
          set -euo pipefail
          npm version 0.5.0 --no-git-tag-version
          rm .github/workflows/_prepare-v0.5.0.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json .github/workflows/_prepare-v0.5.0.yml
          git commit -m 'chore: bump version to 0.5.0'
          git push origin HEAD:release/v0.5.0
